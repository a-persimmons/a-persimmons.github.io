<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨天真 15 问 - 价值排序评测系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --accent-color: #5d7a76;
            --accent-light: #e8efee;
            --accent-hover: #4a6360;
            --success-color: #7a9f7e;
            --border-color: #e0e0e0;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --font-serif: "Songti SC", "SimSun", "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#dcd9d2 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .settings-bar {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .settings-bar:hover { opacity: 1; }

        .config-panel {
            display: none;
            background: #fafafa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }
        .config-panel.active { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .config-input {
            width: 100%; padding: 10px; margin: 8px 0 15px;
            border: 1px solid var(--border-color); border-radius: 6px;
            font-family: monospace; font-size: 13px;
        }

        .welcome-content { text-align: center; padding: 20px 0; }
        .welcome-card {
            background: var(--accent-light);
            padding: 30px;
            border-radius: 12px;
            text-align: left;
            margin: 30px 0;
            color: #3f5250;
        }

        .progress-nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 10px 5px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .progress-nav::-webkit-scrollbar { display: none; }
        
        .progress-dot {
            flex: 0 0 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
            margin: 0 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .progress-dot.active { background: var(--accent-color); transform: scale(1.3); }
        .progress-dot.completed { background: var(--success-color); }
        .progress-dot:hover { transform: scale(1.2); }
        
        .question-area { flex: 1; display: flex; flex-direction: column; }
        
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .q-number {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .q-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #eee;
            color: #888;
        }
        .q-status.completed { background: var(--accent-light); color: var(--accent-color); }

        .q-text {
            font-family: var(--font-serif);
            font-size: 21px;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .answer-box {
            position: relative;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            background: #fafafa;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(93, 122, 118, 0.1);
        }
        textarea:disabled {
            background: #f9f9f9;
            color: #555;
            cursor: default;
        }

        .ai-feedback-box {
            background: #f0f4f3;
            border-left: 4px solid var(--accent-color);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .ai-label {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-content {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        
        .nav-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: var(--accent-light);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .submit-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            min-width: 120px;
            text-align: center;
        }
        .submit-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .submit-btn:disabled { background: #ccc; transform: none; cursor: not-allowed; }
        .submit-btn.next-mode { background: #fff; color: var(--accent-color); border: 1px solid var(--accent-color); }
        .submit-btn.next-mode:hover { background: var(--accent-light); }

        .report-content {
            text-align: left;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }
        .report-content h1 { font-size: 26px; text-align: left; border-bottom: 2px solid var(--accent-light); padding-bottom: 15px; margin-bottom: 25px; color: var(--accent-color); }
        .report-content h2 { font-size: 20px; margin-top: 30px; color: var(--text-primary); }
        .report-content h3 { font-size: 17px; margin-top: 20px; color: #555; }
        .report-content ul { padding-left: 20px; margin-bottom: 15px; }
        .report-content li { margin-bottom: 8px; }
        .report-content blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 20px 0;
            padding: 15px 20px;
            background: var(--accent-light);
            color: #2c3e3b;
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 16px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .container { padding: 25px; margin: 0; border-radius: 0; height: 100vh; }
            .q-text { font-size: 18px; }
            .action-bar { flex-direction: column-reverse; gap: 15px; }
            .nav-btn, .submit-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-bar" onclick="toggleConfig()">⚙️ 配置 API</div>
    
    <div id="configPanel" class="config-panel">
        <h3 style="margin-bottom: 15px;">API 设置</h3>
        <label>Base URL</label>
        <input type="text" id="baseUrl" class="config-input" placeholder="https://api.openai.com/v1">
        <label>API Key</label>
        <input type="password" id="apiKey" class="config-input" placeholder="sk-...">
        <label>Model</label>
        <input type="text" id="modelName" class="config-input" placeholder="gpt-3.5-turbo">
        <button class="submit-btn" style="width:100%; margin-top:10px;" onclick="saveConfig()">保存设置</button>
    </div>

    <div id="step-welcome" class="step fade-in">
        <div class="welcome-content">
            <h1 style="font-family: var(--font-serif); font-size: 32px; color: var(--accent-color); margin-bottom: 10px;">杨天真 15 问</h1>
            <p style="color: #888; letter-spacing: 2px;">个人价值排序评测系统</p>
            
            <div class="welcome-card">
                <p style="margin-bottom: 15px;"><strong>👋 你好，我是你的价值梳理教练。</strong></p>
                <p style="margin-bottom: 15px;">这不仅仅是一次问答，更是一场与内心深处的对话。我们将逐一进行 15 个深度提问。</p>
                <p style="margin-bottom: 15px;">💡 <strong>交互说明：</strong></p>
                <ul style="padding-left: 20px; color: #555; line-height: 1.8;">
                    <li>每答完一题，AI 会给予简短反馈。</li>
                    <li>你可以随时点击"上一题"回顾之前的思考。</li>
                    <li>全部完成后，将生成一份深度评测报告。</li>
                </ul>
            </div>
            
            <button class="submit-btn" style="width: 200px;" onclick="startSession()">开始探索</button>
        </div>
    </div>

    <div id="step-question" class="step hidden">
        <div class="progress-nav" id="progressNav"></div>

        <div class="question-area fade-in" id="questionCard">
            <div class="q-header">
                <span id="qNumber" class="q-number">Question 1</span>
                <span id="qStatus" class="q-status">未开始</span>
            </div>
            
            <h2 id="qText" class="q-text">加载中...</h2>
            
            <div class="answer-box">
                <textarea id="userAnswer" placeholder="请在这里写下你真实的想法，不用在意文笔，诚实最重要..."></textarea>
            </div>

            <div id="aiFeedbackBox" class="ai-feedback-box">
                <div class="ai-label">✨ AI 教练反馈</div>
                <div id="aiFeedbackContent" class="ai-content"></div>
            </div>
        </div>

        <div class="action-bar">
            <button id="prevBtn" class="nav-btn" onclick="prevQuestion()">← 上一题</button>
            <button id="actionBtn" class="submit-btn" onclick="handleAction()">提交回答</button>
            <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">下一题 →</button>
        </div>
    </div>

    <div id="step-loading" class="step hidden">
        <div class="loading-overlay" style="position: relative; background: transparent;">
            <div class="spinner"></div>
            <h3 style="color: var(--accent-color);">正在撰写你的价值报告...</h3>
            <p style="color: #888; margin-top: 10px; font-size: 14px;">正在交叉分析 15 个维度的回答</p>
        </div>
    </div>

    <div id="step-report" class="step hidden">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-family: var(--font-serif);">评测分析报告</h1>
            <p style="color: #888;">基于你的 15 个深度回答生成</p>
        </div>
        <div id="reportContent" class="report-content"></div>
        
        <div style="margin-top: 50px; display: flex; gap: 15px; justify-content: center;">
            <button class="submit-btn" onclick="window.print()">🖨️ 打印 / 存为 PDF</button>
            <button class="nav-btn" style="border-color: var(--accent-color); color: var(--accent-color);" onclick="location.reload()">🔄 重新开始</button>
        </div>
    </div>
</div>

<script>
    const QUESTIONS = [
        "1. 你对你的工作现状满意吗？",
        "2. 如果你对一个事情满意，你会希望不断地重复这件令你满意的事情，从而不断地得到正反馈，还是去做新的事情，找到新的刺激？",
        "3. 如果你对一个事情不满意，你是选择改变自己，还是去改变这件事情？",
        "4. 是事情给你的满足更大，还是人给你的满足更大？",
        "5. 如果你不是你自己，是你的敌人，对你做什么事情，或者说什么话，最容易拿捏你，能够在短时间令你建立对 TA 的信任，而你比较不容易发现 TA 的潜在目的？也就是说，一个人如果刻意地要骗你，或者让你喜欢，TA 假装成什么样子最容易成功，而你有没有建立自己的防火墙，怎么可以识别这些？",
        "6. 假如你一个人在餐厅吃饭，这时候有一个陌生人走过来，想要加入你。如果是同性，什么样的同性你会允许？如果是异性，什么样的异性你会允许？",
        "7. 你在工作中最好的状态是什么样子？通常要具备哪些条件才能帮助你达到最好的状态？而最糟呢？它是怎么发生的？",
        "8. 如果你拥有了一个许愿就一定会实现的能力，而这个愿望只能是关于你自己的，你会实现什么愿望？",
        "9. 你最喜欢听到别人夸你的内容是什么？最讨厌听到的评价是什么？",
        "10. 如果你决定和一个人合作，最看重对方什么品质？而对方一旦什么品质出现，不管 TA 能力有多强，你就绝对不会跟 TA 再合作了？",
        "11. 如果还有三天，你就要离开这个世界了，你只能和一个人待在一起，只有一个名额，你会选择谁？",
        "12. 如果一件事情，你必须做十年，别的什么事情都不能做，你会选择做什么事情？",
        "13. 如果你必须和一个人在一起待十年，每一天都不可以分开，不可以选择自己待着，和 TA 要时时刻刻在一起，你会选择谁？",
        "14. 如果可以回到过去的任何一个时间点，让你改变一件事情，你会回到什么时间，改变什么事情？",
        "15. 你来定义一下，什么是成长？你的偶像是谁？你喜欢 TA 什么？而 TA 如果失去了什么样的特质，你就不会再喜欢 TA 了？你喜欢 TA 的特质，会不会帮助你成为一个更好的人？请用 200 个字总结一下自己的人生，在向陌生人介绍的时候，是你觉得最希望大家看到的你。"
    ];

    let config = {
        baseUrl: 'https://api.siliconflow.cn/v1',
        apiKey: 'sk-obzuggiscfjcdtzsqfnnviadwybhxpvkxwlsaqqrvulzgfce',
        model: 'deepseek-ai/DeepSeek-V3.2'
    };

    let currentIndex = 0;
    let answersData = new Array(QUESTIONS.length).fill(null).map(() => ({
        answer: '',
        feedback: '',
        completed: false
    }));

    window.onload = function() {
        const saved = localStorage.getItem('valueConfig');
        if (saved) {
            config = JSON.parse(saved);
            document.getElementById('baseUrl').value = config.baseUrl;
            document.getElementById('apiKey').value = config.apiKey;
            document.getElementById('modelName').value = config.model;
        }
    };

    function toggleConfig() {
        document.getElementById('configPanel').classList.toggle('active');
    }

    function saveConfig() {
        config.baseUrl = document.getElementById('baseUrl').value.trim() || 'https://api.openai.com/v1';
        config.apiKey = document.getElementById('apiKey').value.trim();
        config.model = document.getElementById('modelName').value.trim() || 'gpt-3.5-turbo';
        if (!config.apiKey) return alert('请输入 API Key');
        localStorage.setItem('valueConfig', JSON.stringify(config));
        toggleConfig();
        alert('配置已保存');
    }

    function showStep(id) {
        document.querySelectorAll('.step').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function startSession() {
        if (!config.apiKey) {
            toggleConfig();
            return alert('请先配置 API Key');
        }
        currentIndex = 0;
        renderProgressNav();
        loadQuestion(0);
        showStep('step-question');
    }

    function renderProgressNav() {
        const nav = document.getElementById('progressNav');
        nav.innerHTML = '';
        QUESTIONS.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = `progress-dot ${idx === currentIndex ? 'active' : ''} ${answersData[idx].completed ? 'completed' : ''}`;
            dot.onclick = () => loadQuestion(idx);
            dot.title = `第 ${idx + 1} 题`;
            nav.appendChild(dot);
        });
    }

    // ✅ 修复：loadQuestion 函数中重置所有按钮状态
    function loadQuestion(index) {
        currentIndex = index;
        const data = answersData[index];
        
        document.getElementById('qNumber').innerText = `Question ${index + 1} / 15`;
        document.getElementById('qText').innerText = QUESTIONS[index];
        
        const statusEl = document.getElementById('qStatus');
        const textarea = document.getElementById('userAnswer');
        const feedbackBox = document.getElementById('aiFeedbackBox');
        const actionBtn = document.getElementById('actionBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // 重置输入框和反馈区
        textarea.value = data.answer;
        feedbackBox.style.display = data.completed ? 'block' : 'none';
        if (data.completed) {
            document.getElementById('aiFeedbackContent').innerText = data.feedback;
            statusEl.innerText = '已完成';
            statusEl.classList.add('completed');
            textarea.disabled = true;
            actionBtn.innerText = '修改回答';
            actionBtn.classList.add('next-mode');
        } else {
            statusEl.innerText = '进行中';
            statusEl.classList.remove('completed');
            textarea.disabled = false;
            actionBtn.innerText = '提交回答';
            actionBtn.classList.remove('next-mode');
        }

        // ✅ 修复：确保按钮始终是可点击的（除非在 loading 状态）
        actionBtn.disabled = false;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = false;

        renderProgressNav();
        document.querySelector('.container').scrollTop = 0;
    }

    function handleAction() {
        const data = answersData[currentIndex];
        const textarea = document.getElementById('userAnswer');
        const actionBtn = document.getElementById('actionBtn');

        if (data.completed) {
            // 修改模式
            textarea.disabled = false;
            data.completed = false;
            data.feedback = '';
            actionBtn.innerText = '重新提交';
            actionBtn.classList.remove('next-mode');
            document.getElementById('aiFeedbackBox').style.display = 'none';
            document.getElementById('qStatus').innerText = '修改中';
            document.getElementById('qStatus').classList.remove('completed');
            renderProgressNav();
            return;
        }

        const answer = textarea.value.trim();
        if (!answer) return alert('请写下你的想法');

        // Loading 状态
        actionBtn.disabled = true;
        actionBtn.innerText = 'AI 分析中...';
        
        callAIInteraction(answer).then(feedback => {
            answersData[currentIndex].answer = answer;
            answersData[currentIndex].feedback = feedback;
            answersData[currentIndex].completed = true;
            
            loadQuestion(currentIndex);
            setTimeout(() => {
                document.getElementById('aiFeedbackBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }).catch(err => {
            alert('AI 响应失败：' + err.message);
            // ✅ 修复：失败后也要重置按钮状态
            actionBtn.disabled = false;
            actionBtn.innerText = '提交回答';
        });
    }

    function prevQuestion() {
        if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function nextQuestion() {
        if (!answersData[currentIndex].completed) {
            if (confirm('这道题还没提交，确定要跳到下一题吗？（你可以稍后回来补充）')) {
                if (currentIndex < QUESTIONS.length - 1) loadQuestion(currentIndex + 1);
            }
            return;
        }

        if (currentIndex === QUESTIONS.length - 1) {
            const allDone = answersData.every(d => d.completed);
            if (allDone || confirm('还有题目未完成，确定现在生成报告吗？')) {
                generateReport();
            }
        } else {
            loadQuestion(currentIndex + 1);
        }
    }

    async function callAIInteraction(answer) {
        const currentQ = QUESTIONS[currentIndex];
        const messages = [
            { role: "system", content: `你是一位温暖、敏锐的人生教练。用户正在回答"杨天真 15 问"。
            请针对用户的回答给予简短的反馈（50-80 字）。
            1. 表示理解或共情。
            2. 如果回答太简短，温和地引导他多思考一点。
            3. 不要长篇大论，不要说教。
            4. 语气要像朋友一样自然。` },
            { role: "user", content: `问题：${currentQ}\n回答：${answer}` }
        ];
        return await fetchAI(messages);
    }

    async function generateReport() {
        showStep('step-loading');
        
        let qaText = "";
        answersData.forEach((item, idx) => {
            qaText += `Q${idx+1}: ${QUESTIONS[idx]}\nA${idx+1}: ${item.answer || '(未回答)'}\n\n`;
        });

        const messages = [
            { role: "system", content: `你是一位资深的人生战略顾问。请根据用户的 15 问回答，生成一份《个人价值排序评测分析报告》。
            要求：
            1. 使用 Markdown 格式。
            2. 结构包含：【核心价值关键词】、【能量地图】（滋养 vs 消耗）、【关系边界】、【深度洞察与矛盾点】（重点分析回答中的不一致）、【行动建议】（3 条）、【人生定义】。
            3. 语气专业、温暖、有洞察力。
            4. 直接输出报告内容，不要寒暄。` },
            { role: "user", content: qaText }
        ];

        try {
            const report = await fetchAI(messages);
            document.getElementById('reportContent').innerHTML = marked.parse(report);
            showStep('step-report');
        } catch (err) {
            alert('报告生成失败：' + err.message);
            showStep('step-question');
        }
    }

    async function fetchAI(messages) {
        let url = config.baseUrl.replace(/\/$/, "");
        if (!url.endsWith('/chat/completions')) url += '/chat/completions';

        const res = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${config.apiKey}`
            },
            body: JSON.stringify({
                model: config.model,
                messages: messages,
                temperature: 0.7
            })
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || 'Request Failed');
        }
        const data = await res.json();
        return data.choices[0].message.content;
    }
</script>
