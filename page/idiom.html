<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣说歇后语与俗语</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SimSun', 'STKaiti', 'KaiTi', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary-red: #c03a2b;
            --secondary-red: #e74c3c;
            --dark-red: #a52718;
            --light-yellow: #fef9e7;
            --dark-yellow: #f7dc6f;
            --ink-black: #2c3e50;
            --paper-white: #fdfcf6;
            --seal-red: #e74c3c;
            --border-color: #d5ad6d;
            --shadow-color: rgba(92, 64, 51, 0.2);
        }
        
        body {
            background-color: var(--paper-white);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d5ad6d' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--ink-black);
            line-height: 1.6;
            padding-bottom: 50px;
            min-height: 100vh;
        }
        
        /* 灯笼装饰 */
        .lantern {
            position: absolute;
            top: 20px;
            width: 60px;
            height: 80px;
            background-color: var(--primary-red);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }
        
        .lantern:before, .lantern:after {
            content: '';
            position: absolute;
            background-color: var(--dark-yellow);
        }
        
        .lantern:before {
            width: 20px;
            height: 15px;
            top: -15px;
            left: 20px;
            border-radius: 5px 5px 0 0;
        }
        
        .lantern:after {
            width: 10px;
            height: 20px;
            bottom: -20px;
            left: 25px;
            border-radius: 0 0 5px 5px;
        }
        
        .lantern-left {
            left: 10%;
        }
        
        .lantern-right {
            right: 10%;
        }
        
        /* 头部样式 */
        header {
            background: linear-gradient(to bottom, var(--primary-red), var(--dark-red));
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 40px;
            position: relative;
            border-bottom: 5px solid var(--border-color);
            box-shadow: 0 5px 15px var(--shadow-color);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .title-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 var(--dark-red);
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }
        
        .title-seal {
            position: absolute;
            top: -20px;
            right: -40px;
            width: 70px;
            height: 70px;
            background-color: var(--seal-red);
            border-radius: 50%;
            transform: rotate(15deg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 20px;
            color: var(--light-yellow);
        }
        
        /* 控制面板 */
        .controls {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        
        .category-filter, .search-box {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 3px 10px var(--shadow-color);
            border: 1px solid var(--border-color);
        }
        
        .category-filter label, .search-box label {
            margin-right: 10px;
            font-weight: bold;
            color: var(--primary-red);
        }
        
        #categorySelect, #searchInput {
            border: none;
            outline: none;
            font-size: 1rem;
            min-width: 200px;
            background: transparent;
        }
        
        .search-box button {
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            margin-left: 5px;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: var(--dark-red);
        }
        
        .random-btn {
            background: var(--dark-yellow);
            color: var(--ink-black);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 10px var(--shadow-color);
            transition: all 0.3s;
        }
        
        .random-btn:hover {
            background: #f1c40f;
            transform: translateY(-2px);
        }
        
        /* 卡片容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        /* 卡片样式 - 优化布局 */
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px var(--shadow-color);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 5px solid var(--primary-red);
            display: flex;
            flex-direction: column;
            min-height: 360px;
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px var(--shadow-color);
        }
        
        .card-header {
            background: var(--light-yellow);
            padding: 15px;
            border-bottom: 1px dashed var(--border-color);
        }
        
        /* 标签行 - category和type放在同一行 */
        .tags-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .card-category {
            background: var(--primary-red);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        
        .type {
            background: var(--dark-yellow);
            color: var(--ink-black);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }
        
        /* 短语区域 */
        .phrase {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            line-height: 1.3;
            word-break: break-word;
            margin-bottom: 5px;
        }
        
        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }
        
        .meaning, .example {
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        
        .meaning-title, .example-title {
            font-weight: bold;
            color: var(--dark-red);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        
        .meaning-text, .example-text {
            color: var(--ink-black);
            padding-left: 10px;
            border-left: 3px solid var(--dark-yellow);
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }
        
        /* 悬停提示 */
        .flip-hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(192, 58, 43, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* 卷轴装饰 */
        .scroll-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to right, var(--primary-red), var(--dark-red));
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 0.9rem;
            border-top: 3px solid var(--border-color);
        }
        
        .scroll-ends {
            position: absolute;
            top: -10px;
            width: 60px;
            height: 20px;
            background: var(--border-color);
            border-radius: 50%;
        }
        
        .scroll-ends.left {
            left: 10%;
        }
        
        .scroll-ends.right {
            right: 10%;
        }
        
        /* 加载状态 */
        .loading-container {
            max-width: 1200px;
            margin: 50px auto;
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 5px solid var(--light-yellow);
            border-top: 5px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: var(--primary-red);
        }
        
        .error-container {
            max-width: 1200px;
            margin: 50px auto;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
            border-top: 5px solid var(--secondary-red);
        }
        
        .error-icon {
            font-size: 3rem;
            color: var(--secondary-red);
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 1.2rem;
            color: var(--ink-black);
            margin-bottom: 20px;
        }
        
        .retry-btn {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        
        .retry-btn:hover {
            background: var(--dark-red);
        }
        
        /* 卡片翻转效果 */
        .card-flip {
            perspective: 1000px;
            height: 380px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        
        .card-flip:hover .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .card-back {
            background: var(--light-yellow);
            transform: rotateY(180deg);
            padding: 20px;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid var(--primary-red);
        }
        
        .card-back-title {
            color: var(--primary-red);
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.3;
            word-break: break-word;
            max-width: 100%;
        }
        
        .card-back-content {
            font-size: 1rem;
            color: var(--ink-black);
            line-height: 1.5;
            width: 100%;
        }
        
        .card-back-content p {
            margin-bottom: 10px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 0 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .category-filter, .search-box {
                width: 100%;
            }
            
            #categorySelect, #searchInput {
                width: 100%;
            }
            
            .lantern {
                display: none;
            }
            
            .card-flip {
                height: 370px;
            }
            
            .phrase {
                font-size: 1.3rem;
            }
            
            .card-category, .type {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            
            .card-category {
                max-width: 150px;
            }
        }
        
        @media (max-width: 480px) {
            .card-flip {
                height: 400px;
            }
            
            .phrase {
                font-size: 1.2rem;
            }
            
            .meaning-text, .example-text {
                font-size: 0.9rem;
            }
            
            .tags-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        /* 无结果提示 */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--primary-red);
            font-size: 1.2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
        }
    </style>
</head>
<body>
    <!-- 灯笼装饰 -->
    <div class="lantern lantern-left"></div>
    <div class="lantern lantern-right"></div>
    
    <header>
        <div class="header-content">
            <div class="title-container">
                <h1>趣说歇后语与俗语</h1>
                <div class="title-seal">民间<br>智慧</div>
            </div>
            <p class="subtitle">歇后语和俗语是汉语中的瑰宝，言简意赅，富含哲理与幽默。这里整理了不同场景下的常用表达，展示中华语言文化的独特魅力。</p>
            <p class="subtitle"><i class="fas fa-cloud-download-alt"></i> 数据来源: https://data.com/d.json</p>
        </div>
    </header>
    
    <main>
        <div class="controls" style="display: none;" id="controlsSection">
            <div class="category-filter">
                <label for="categorySelect"><i class="fas fa-filter"></i> 分类筛选：</label>
                <select id="categorySelect">
                    <option value="all">全部类别</option>
                </select>
            </div>
            
            <div class="search-box">
                <label for="searchInput"><i class="fas fa-search"></i> 搜索：</label>
                <input type="text" id="searchInput" placeholder="输入歇后语、意思或示例...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            
            <button class="random-btn" id="randomBtn">
                <i class="fas fa-random"></i> 随机推荐
            </button>
        </div>
        
        <!-- 加载状态容器 -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载歇后语数据...</div>
        </div>
        
        <!-- 错误容器 -->
        <div class="error-container" id="errorContainer" style="display: none;">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="error-message" id="errorMessage">数据加载失败，请检查网络连接</div>
            <button class="retry-btn" id="retryBtn">
                <i class="fas fa-redo"></i> 重新加载
            </button>
        </div>
        
        <!-- 卡片容器 -->
        <div class="container" id="cardsContainer" style="display: none;">
            <!-- 卡片将通过JavaScript动态生成 -->
        </div>
    </main>
    
    <div class="scroll-decoration">
        <div class="scroll-ends left"></div>
        <div>中华语言文化 · 民间智慧结晶 · 鼠标悬停卡片可查看详情</div>
        <div class="scroll-ends right"></div>
    </div>
    
    <script>
        // 全局变量存储数据
        let idiomsData = null;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 显示加载状态
            showLoading();
            
            // 加载数据
            loadData();
            
            // 绑定重试按钮事件
            document.getElementById('retryBtn').addEventListener('click', loadData);
        });
        
        // 从外部URL加载数据
        async function loadData() {
            // 显示加载状态，隐藏错误和卡片
            showLoading();
            hideError();
            hideCards();
            hideControls();
            
            try {
                // 使用模拟数据URL，实际开发中替换为真实URL
                // const response = await fetch('https://data.com/d.json');
                
                // 由于实际URL可能不存在，这里使用模拟数据
                // 实际使用时请取消注释上面的fetch并删除下面的模拟代码
                
                // 模拟网络延迟
                // await new Promise(resolve => setTimeout(resolve, 800));
                
                // 模拟数据（与之前相同）
                
                // 实际使用fetch的代码（取消注释并替换上面的模拟代码）
                
                const response = await fetch('https://blog.codingforjoy.com/page/d.json');
                
                if (!response.ok) {
                    // throw new Error(`HTTP error! status: ${response.status}`);
                    idiomsData = {
                        "idioms_and_sayings": [
                        {
                            "category": "回避问题，打马虎眼",
                            "explanation": "用于不直接回答问题，岔开话题或含糊应对。",
                            "items": [
                                {
                                    "phrase": "张家长，李家短",
                                    "type": "俗语",
                                    "meaning": "议论别人家的琐事。用来回避个人决策问题，暗示这类讨论如同闲谈，没有标准答案。",
                                    "example": "A：‘我该找喜欢我的还是我喜欢的？’ B：‘张家长，李家短。’"
                                },
                                {
                                    "phrase": "今天天气哈哈哈",
                                    "type": "俗语",
                                    "meaning": "用谈论无关紧要的天气来尴尬地岔开敏感或不欲讨论的话题。",
                                    "example": "A：‘你对这事有什么看法？’ B：‘哎，今天天气真不错哈哈哈。’"
                                },
                                {
                                    "phrase": "东边日出西边雨",
                                    "type": "俗语/诗句化用",
                                    "meaning": "用自然现象形容情况复杂或对立，实则答非所问，表示不予置评或说不清。",
                                    "example": "A：‘他俩关系到底怎么样？’ B：‘东边日出西边雨，看不透。’"
                                },
                                {
                                    "phrase": "葫芦僧判断葫芦案",
                                    "type": "歇后语（典故）",
                                    "meaning": "指糊涂人办糊涂事，或对一笔糊涂账含糊过去，不予深究和明确判断。",
                                    "example": "A：‘这责任到底怎么划分？’ B：‘算了，葫芦僧判断葫芦案，别较真了。’"
                                },
                                {
                                    "phrase": "王顾左右而言他",
                                    "type": "典故（成语）",
                                    "meaning": "字面意思是（大王）环顾左右，说别的事。生动描绘故意回避问题、转移话题的神态。",
                                    "example": "每当问到关键问题，他就王顾左右而言他。"
                                }
                            ]
                        },
                        {

        // 初始化应用
        function initializeApp() {
            // 隐藏加载状态
            hideLoading();
            
            // 显示控制面板
            showControls();
            
            // 初始化分类筛选
            initCategoryFilter();
            
            // 渲染所有卡片
            renderAllCards();
            
            // 显示卡片容器
            showCards();
            
            // 绑定搜索事件
            document.getElementById('searchBtn').addEventListener('click', performSearch);
            document.getElementById('searchInput').addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });
            
            // 绑定随机推荐事件
            document.getElementById('randomBtn').addEventListener('click', showRandomCard);
        }
        
        // 初始化分类筛选
        function initCategoryFilter() {
            const categorySelect = document.getElementById('categorySelect');
            
            // 清空现有选项（除了"全部"）
            while (categorySelect.options.length > 1) {
                categorySelect.remove(1);
            }
            
            // 添加分类选项
            idiomsData.idioms_and_sayings.forEach(category => {
                const option = document.createElement('option');
                option.value = category.category;
                option.textContent = category.category;
                categorySelect.appendChild(option);
            });
            
            // 绑定筛选事件
            categorySelect.addEventListener('change', filterByCategory);
        }
        
        // 渲染所有卡片
        function renderAllCards() {
            renderCards(idiomsData.idioms_and_sayings);
        }
        
        // 根据数据渲染卡片
        function renderCards(categories) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            let hasItems = false;
            
            // 遍历所有分类和项目
            categories.forEach(category => {
                category.items.forEach(item => {
                    hasItems = true;
                    createCard(category, item);
                });
            });
            
            // 如果没有结果，显示提示
            if (!hasItems) {
                container.innerHTML = '<div class="no-results"><i class="fas fa-search"></i> 没有找到匹配的歇后语或俗语，请尝试其他搜索词。</div>';
            }
        }
        
        // 创建单个卡片
        function createCard(category, item) {
            const container = document.getElementById('cardsContainer');
            
            // 创建卡片容器
            const cardFlip = document.createElement('div');
            cardFlip.className = 'card-flip';
            
            // 创建卡片内部容器
            const cardInner = document.createElement('div');
            cardInner.className = 'card-inner';
            
            // 卡片正面
            const cardFront = document.createElement('div');
            cardFront.className = 'card-front';
            cardFront.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div class="tags-row">
                            <div class="card-category">${category.category}</div>
                            <div class="type">${item.type}</div>
                        </div>
                        <div class="phrase">${item.phrase}</div>
                    </div>
                    <div class="card-body">
                        <div class="meaning">
                            <div class="meaning-title"><i class="fas fa-lightbulb"></i> 含义解析</div>
                            <div class="meaning-text">${item.meaning}</div>
                        </div>
                        <div class="example">
                            <div class="example-title"><i class="fas fa-comments"></i> 使用示例</div>
                            <div class="example-text">${item.example}</div>
                        </div>
                    </div>
                    <div class="flip-hint"><i class="fas fa-sync-alt"></i> 悬停查看详情</div>
                </div>
            `;
            
            // 卡片背面
            const cardBack = document.createElement('div');
            cardBack.className = 'card-back';
            cardBack.innerHTML = `
                <div class="card-back-title">${item.phrase}</div>
                <div class="card-back-content">
                    <p><strong>分类：</strong>${category.category}</p>
                    <p><strong>类型：</strong>${item.type}</p>
                    <p><strong>场景说明：</strong>${category.explanation}</p>
                    <p style="margin-top: 15px; font-style: italic; color: var(--primary-red);">"${item.example}"</p>
                </div>
            `;
            
            // 组合卡片
            cardInner.appendChild(cardFront);
            cardInner.appendChild(cardBack);
            cardFlip.appendChild(cardInner);
            container.appendChild(cardFlip);
        }
        
        // 按分类筛选
        function filterByCategory() {
            const selectedCategory = document.getElementById('categorySelect').value;
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (selectedCategory === 'all' && !searchTerm) {
                // 显示所有
                renderAllCards();
                return;
            }
            
            // 筛选数据
            const filteredCategories = idiomsData.idioms_and_sayings.filter(category => {
                if (selectedCategory !== 'all' && category.category !== selectedCategory) {
                    return false;
                }
                
                // 如果搜索词不为空，进一步筛选项目
                if (searchTerm) {
                    const filteredItems = category.items.filter(item => {
                        return item.phrase.toLowerCase().includes(searchTerm) ||
                               item.meaning.toLowerCase().includes(searchTerm) ||
                               item.example.toLowerCase().includes(searchTerm) ||
                               item.type.toLowerCase().includes(searchTerm);
                    });
                    
                    // 替换当前分类的项目为筛选后的结果
                    category.items = filteredItems;
                    return filteredItems.length > 0;
                }
                
                return true;
            });
            
            // 渲染筛选后的卡片
            renderCards(filteredCategories);
        }
        
        // 执行搜索
        function performSearch() {
            filterByCategory();
        }
        
        // 随机推荐一个卡片
        function showRandomCard() {
            // 收集所有项目
            const allItems = [];
            idiomsData.idioms_and_sayings.forEach(category => {
                category.items.forEach(item => {
                    allItems.push({category, item});
                });
            });
            
            if (allItems.length === 0) return;
            
            // 随机选择一个
            const randomIndex = Math.floor(Math.random() * allItems.length);
            const randomItem = allItems[randomIndex];
            
            // 清空容器并只显示随机卡片
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            // 创建随机卡片
            createCard(randomItem.category, randomItem.item);
            
            // 显示提示
            const hint = document.createElement('div');
            hint.className = 'no-results';
            hint.innerHTML = `<i class="fas fa-random"></i> 已随机推荐一条歇后语/俗语，点击"随机推荐"按钮可换一条。`;
            container.appendChild(hint);
            
            // 重置筛选和搜索
            document.getElementById('categorySelect').value = 'all';
            document.getElementById('searchInput').value = '';
        }
        
        // 显示/隐藏函数
        function showLoading() {
            document.getElementById('loadingContainer').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loadingContainer').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorContainer').style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorContainer').style.display = 'none';
        }
        
        function showCards() {
            document.getElementById('cardsContainer').style.display = 'grid';
        }
        
        function hideCards() {
            document.getElementById('cardsContainer').style.display = 'none';
        }
        
        function showControls() {
            document.getElementById('controlsSection').style.display = 'flex';
        }
        
        function hideControls() {
            document.getElementById('controlsSection').style.display = 'none';
        }
    </script>
